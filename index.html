<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>themoviedb-discovery-app</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Films populaires</h1>
        <h2>
          Films tendances en France, d'après les données de <b>The Movie Database</b>
        </h2>
      </header>
      <section>
      {movies ? (
        <ul>
          {movies.map((movie) => (
            <li key={movie.id}>
              <article>
                <MovieItem movie={movie} />
              </article>
            </li>
          ))}
        </ul>
      ) : (
        <p>Loading...</p>
      )}
      </section>
    </main>
    <div id="root"></div>
    <script type="module" src="/src/front-end/main.tsx"></script>
  </body>
</html>
